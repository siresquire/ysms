# Local development database. Production uses a hosted Postgres (Supabase or Neon).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ysms
      POSTGRES_PASSWORD: ysms
      POSTGRES_DB: ysms
    ports:
      - "5433:5432"
    volumes:
      - ysms-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ysms"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ysms-db:
